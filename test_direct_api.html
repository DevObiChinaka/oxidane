<!DOCTYPE html>
<html>
<head>
    <title>Test Coupon API Direct</title>
</head>
<body>
    <h1>Direct API Test</h1>
    <button onclick="testAPI()">Test Coupon API</button>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                // Get token from localStorage (if it exists)
                const token = localStorage.getItem('admin_token');
                console.log('Token found:', !!token);
                
                const headers = {
                    'Content-Type': 'application/json'
                };
                
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                console.log('Making request with headers:', headers);
                
                const response = await fetch('http://127.0.0.1:8000/api/admin/pricing/coupons/', {
                    method: 'GET',
                    headers: headers,
                    credentials: 'include'
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Response data:', data);
                    
                    resultsDiv.innerHTML = `
                        <h2>Success! Status: ${response.status}</h2>
                        <h3>Raw Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <h3>Analysis:</h3>
                        <p>Type: ${typeof data}</p>
                        <p>Is Array: ${Array.isArray(data)}</p>
                        <p>Has 'results' key: ${'results' in (data || {})}</p>
                        <p>Length/Count: ${Array.isArray(data) ? data.length : (data?.results?.length || data?.count || 'N/A')}</p>
                    `;
                } else {
                    const errorText = await response.text();
                    console.log('Error response:', errorText);
                    
                    resultsDiv.innerHTML = `
                        <h2>Error! Status: ${response.status}</h2>
                        <pre>${errorText}</pre>
                    `;
                }
                
            } catch (error) {
                console.error('Request failed:', error);
                resultsDiv.innerHTML = `
                    <h2>Network Error</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
