<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Auth</title>
</head>
<body>
    <h1>Admin Authentication Test</h1>
    <div id="result"></div>
    
    <script>
        async function testAuth() {
            const token = localStorage.getItem('admin_token');
            const user = localStorage.getItem('admin_user');
            
            console.log('Token:', token ? 'Present' : 'Missing');
            console.log('User:', user);
            
            if (!token) {
                document.getElementById('result').innerHTML = '❌ No admin token found in localStorage';
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/admin-auth/check-session/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.authenticated) {
                    document.getElementById('result').innerHTML = `✅ Authenticated as: ${data.user.username || data.user.email}`;
                } else {
                    document.getElementById('result').innerHTML = `❌ Authentication failed: ${data.error || 'Unknown error'}`;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `❌ Connection error: ${error.message}`;
            }
        }
        
        testAuth();
    </script>
</body>
</html>
