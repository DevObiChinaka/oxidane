<!DOCTYPE html>
<html>
<head>
    <title>Test Coupon API</title>
</head>
<body>
    <h1>Testing Coupon API</h1>
    <div id="results"></div>
    
    <script>
        async function testCouponAPI() {
            try {
                console.log('Testing coupon API...');
                
                // Test without authentication first
                const response = await fetch('http://localhost:8000/api/admin/pricing/coupons/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Response data:', data);
                    document.getElementById('results').innerHTML = 
                        '<h2>Success!</h2><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    const errorText = await response.text();
                    console.log('Error response:', errorText);
                    document.getElementById('results').innerHTML = 
                        '<h2>Error ' + response.status + '</h2><pre>' + errorText + '</pre>';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('results').innerHTML = 
                    '<h2>Network Error</h2><pre>' + error.message + '</pre>';
            }
        }
        
        // Test on page load
        window.onload = testCouponAPI;
    </script>
</body>
</html>
